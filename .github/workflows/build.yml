name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test gesture rules
        if: matrix.arch == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package portable app
        shell: pwsh
        run: ./scripts/Package.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DeskToggle-${{ matrix.arch }}
          path: |
            dist/DeskToggle-${{ matrix.arch }}.exe
            dist/DeskToggle-${{ matrix.arch }}.exe.sha256
            dist/DeskToggle-${{ matrix.arch }}.zip
            dist/DeskToggle-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DeskToggle-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for arch in x64 ARM64; do
            for format in exe zip; do
              test -s "DeskToggle-$arch.$format"
              sha256sum --check "DeskToggle-$arch.$format.sha256"
            done
          done
      - name: Publish version with ready-to-run applications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "DeskToggle $RELEASE_TAG" --notes-file "$notes" --latest
